<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OCR Expense Tracker & Receipt Parser - Flutter & Dart">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ExpenseOCR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OCR Expense Tracker & Receipt Parser</title>
  <link rel="manifest" href="manifest.json">

  <!-- Client-side OCR fallback for the PWA. Recognition runs in WebAssembly in
       the user's browser; receipt images are not uploaded to an OCR service. -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    let receiptOcrWorker;
    window.recognizeReceiptImage = async function (imageUrl) {
      if (!window.Tesseract) {
        throw new Error('Không tải được bộ OCR trên trình duyệt. Hãy kiểm tra kết nối mạng.');
      }
      receiptOcrWorker ??= await Tesseract.createWorker('vie+eng');
      const result = await receiptOcrWorker.recognize(imageUrl);
      return result.data.text || '';
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
